sonar.projectKey=petry-projects_google-app-scripts
sonar.organization=petry-projects
sonar.projectName=google-app-scripts
sonar.sources=src,gas-installer
# GAS (.gs) files are excluded because:
# 1. Jest cannot import .gs files directly (GAS-specific syntax)
# 2. Testable logic is extracted to .js files and imported via interop guards
# 3. GAS entry points are inherently untestable in Node.js environment
# Exclude from both source analysis and coverage metrics to ensure
# new code coverage metric doesn't include untestable GAS entry points
sonar.exclusions=_bmad/**,_bmad-output/**,.claude/**,deploy/**,**/*.gs,**/tests/**,**/*.test.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.gs,**/config.gs,**/config.js
sonar.cpd.exclusions=**/*.gs,**/tests/**,**/*.test.js
sonar.javascript.exclusions=**/*.gs

# SonarCloud S7637 exemption for first-party reusable-ref caller stubs (#404).
# These thin caller stubs contain ONLY a combsmith/.github(-private)
# reusable `uses:` ref, pinned to a moving channel/tag (`@<name>/stable`,
# `@v1`/`@v2`) by org standard — intentionally NOT SHA-pinned (see
# standards/ci-standards.md#sonarcloud-exemption-first-party-reusable-ref-s7637
# and the Action Pinning Policy exemption). S7637 is suppressed on each stub
# file individually; ci.yml / sonarcloud.yml and any third-party `uses:` keep
# full SHA-pin enforcement — do NOT replace these with a blanket
# `workflows/*.yml` resourceKey.
sonar.issue.ignore.multicriteria=\
  s7637_agentshield,\
  s7637_prreviewmention,\
  s7637_prautoreview,\
  s7637_autorebase,\
  s7637_dependabotrebase,\
  s7637_dependabotautomerge,\
  s7637_dependencyaudit,\
  s7637_featureideation,\
  s7637_addtoproject,\
  s7637_devlead

sonar.issue.ignore.multicriteria.s7637_agentshield.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.s7637_agentshield.resourceKey=**/agent-shield.yml

sonar.issue.ignore.multicriteria.s7637_prreviewmention.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.s7637_prreviewmention.resourceKey=**/pr-review-mention.yml

sonar.issue.ignore.multicriteria.s7637_prautoreview.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.s7637_prautoreview.resourceKey=**/pr-auto-review.yml

sonar.issue.ignore.multicriteria.s7637_autorebase.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.s7637_autorebase.resourceKey=**/auto-rebase.yml

sonar.issue.ignore.multicriteria.s7637_dependabotrebase.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.s7637_dependabotrebase.resourceKey=**/dependabot-rebase.yml

sonar.issue.ignore.multicriteria.s7637_dependabotautomerge.ruleKey=githubactions:S7637

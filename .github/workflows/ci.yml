name: CI

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For same-repo PRs, check out the head branch explicitly so tests
          # run against the exact branch commit (not the synthetic merge commit).
          # For fork PRs, omit ref so the action falls back to the merge commit
          # (fork branch names don't exist in the base repo and cause checkout
          # to fail when ref is set to head.ref unconditionally).
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || '' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # --- Same-repo PR: auto-fix and push is handled in the separate 'autofix' job ---

      # --- Fork PR: check-only with instructions ---
      - name: Check formatting and lint (fork PR)
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Fork PR detected — running check-only (cannot push fixes to forks)."
          echo "If this step fails, please run the following locally and push your changes:"
          echo "  npm run format"
          echo "  npm run lint -- --fix"
          npm run check

      # --- Push to main: check-only ---
      - name: Check formatting and lint (push to main)
        if: github.event_name == 'push'
        run: npm run check

      - name: Type check
        run: npm run typecheck

  autofix:
    needs: build-and-test
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_patch: ${{ steps.patch.outputs.has_patch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Format and lint (auto-fix)
        run: |
          npm run format
          npm run lint -- --fix

      # No push token is available in this job: PR-controlled tooling (npm
      # scripts, git hooks) runs here, so the fixes are exported as a patch and
      # applied + pushed by the separate 'autofix-push' job on a clean checkout.
      - name: Export auto-fixes as patch
        id: patch
        run: |
          git add -u -- . ':(exclude).github/workflows'
          git diff --cached --binary > "${RUNNER_TEMP}/autofix.patch"
          if [ -s "${RUNNER_TEMP}/autofix.patch" ]; then
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
          fi

      # Passed as an artifact: job outputs are capped at ~1 MB.
      - name: Upload auto-fix patch
        if: steps.patch.outputs.has_patch == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix.patch
          if-no-files-found: error

      - name: Verify no remaining issues after auto-fix
        run: npm run check

  autofix-push:
    needs: autofix
    if: needs.autofix.outputs.has_patch == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code (clean, no PR-installed tooling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Download auto-fix patch
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix-patch

      - name: Commit and push auto-fixes
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::GH_PAT_DON_PETRY (or legacy GH_PAT_WORKFLOWS) is required for autofix pushes."
            exit 1
          fi
          numstat_file="${RUNNER_TEMP}/autofix-numstat.bin"
          if ! git apply --numstat -z "${RUNNER_TEMP}/autofix-patch/autofix.patch" > "${numstat_file}"; then
            echo "::error::unable to inspect autofix patch; refusing to push."
            exit 1
          fi
          if tr '\0' '\n' < "${numstat_file}" | grep -Eq '^(([0-9]+|-)[[:space:]]+([0-9]+|-)[[:space:]]+)?\.github/workflows/'; then
            echo "::error::autofix patch touches workflow files; refusing to push."
            exit 1
          fi
          git apply --index "${RUNNER_TEMP}/autofix-patch/autofix.patch"
          if git diff --cached --name-only -z | tr '\0' '\n' | grep -Eq '^\.github/workflows/'; then
            echo "::error::autofix patch touches workflow files; refusing to push."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): apply prettier/eslint auto-fixes"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:"${HEAD_REF}"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout (full history)
        # Pin to SHA per Action Pinning Policy (ci-standards.md#action-pinning-policy).
        # Look up current SHA: gh api repos/actions/checkout/git/refs/tags/v4 --jq '.object.sha'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        # Pinned to SHA per Action Pinning Policy (ci-standards.md#action-pinning-policy).
        # Refresh with: gh api repos/gitleaks/gitleaks-action/git/refs/tags/v2.3.9 --jq '.object.sha'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        with:
          args: detect --source . --redact --verbose --exit-code 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
